name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/windows-build.yml"
      - "frontend/**"
      - "cmd/**"
      - "config/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Go server (windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build syne-server.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/syne-server.exe ./cmd/syne-server
          $hash = (Get-FileHash dist/syne-server.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  syne-server.exe" | Set-Content -Encoding ascii dist/syne-server.exe.sha256

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: syne-server-windows
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Tauri app (windows)
    needs: server
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/src-tauri -> target

      # tauri build отказывается работать с идентификатором из шаблона.
      # Проверяем заранее, чтобы причина была видна сразу, а не в хвосте лога сборки.
      - name: Check bundle identifier
        shell: pwsh
        run: |
          $conf = Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($conf.identifier -eq "com.tauri.dev") {
            Write-Error "tauri.conf.json: change identifier from the default 'com.tauri.dev' (for example to 'com.syne.server')"
            exit 1
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Если приложение упаковывает сервер как sidecar (bundle.externalBin в
      # tauri.conf.json), Tauri ждёт файл «<имя>-<target triple>.exe».
      - name: Build sidecar (if configured)
        shell: pwsh
        run: |
          $conf = Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $bins = @($conf.bundle.externalBin) | Where-Object { $_ }
          if ($bins.Count -eq 0) {
            Write-Host "No externalBin in tauri.conf.json, skipping sidecar build"
            exit 0
          }
          foreach ($b in $bins) {
            if ((Split-Path $b -Leaf) -ne "syne-server") {
              Write-Warning "Unknown sidecar '$b' skipped"
              continue
            }
            $out = "frontend/src-tauri/$b-x86_64-pc-windows-msvc.exe"
            New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
            go build -trimpath -ldflags "-s -w" -o $out ./cmd/syne-server
            Write-Host "Built sidecar: $out"
          }

      - name: Build Tauri Windows bundle
        working-directory: frontend
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: syne-server-desktop-windows
          path: |
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find artifacts -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes --verify-tag
